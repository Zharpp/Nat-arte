<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | NatArt</title>

    <!-- Biblioteca de Ícones (Font Awesome CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Link para a folha de estilos na pasta css/ -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- CABEÇALHO & NAVEGAÇÃO -->
    <header class="header-principal">
        <div class="logo-container">
            <a href="index.html" class="logo">
                <img src="png/natart.ico" alt="Logo NatArt" class="logo-img">
                <span>NatArt</span>
            </a>
            <span class="logo-subtitle">Ilustração & Arte Digital</span>
        </div>

        <nav class="menu-navegacao">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="galeria.html" class="active">Galeria</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL (GALERIA / CARROSSEL DINÂMICO) -->
    <main>
		 
        <section class="galeria-section">
            <h2>Portfólio de Ilustrações</h2>
			   <div class="hero-texto">
                <a href="contato.html" class="btn-cta">Faça seu Orçamento</a>
            </div>
            <!-- Container do Carrossel com ID para o JavaScript -->
            <div class="carousel-container" id="carousel">
                <button class="carousel-btn prev" id="btnPrev" aria-label="Imagem anterior">&#10094;</button>
                <button class="carousel-btn next" id="btnNext" aria-label="Próxima imagem">&#10095;</button>

                <!-- Trilho onde o JavaScript vai injetar as 21 artes -->
                <div class="carousel-track" id="carouselTrack"></div>
            </div>

            <!-- Indicadores (dots) injetados via JavaScript -->
            <div class="carousel-dots" id="carouselDots"></div>
        </section>
    </main>

    <!-- RODAPÉ & INSTAGRAM -->
    <footer class="footer-principal">
        <a href="https://www.instagram.com/naty.artee" target="_blank" rel="noopener noreferrer" class="btn-instagram">
            <i class="fa-brands fa-instagram"></i>
            Siga no Instagram: @naty.artee
        </a>
        <p>&copy; 2026 NatArt. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DO CARROSSEL (Gera as 21 artes dinamicamente) -->
    <script src="js/galeria.js"></script>

</body>
</html>
