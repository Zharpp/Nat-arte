<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - NatArt</title>
    <link rel="icon" type="image/x-icon" href="natart.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-header">
                <img src="natart.ico" alt="Ícone NatArt" class="logo-img">
                <span class="logo-text">NatArt</span>
            </div>
            <span class="logo-subtitle">Artista | Visual Art</span>
        </div>

        <nav class="nav-menu">
            <a href="index.html">Principal</a>
            <a href="galeria.html">Galeria</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html" class="active">Contato</a>
        </nav>
    </header>

    <!-- Conteúdo Principal - Página de Contato -->
    <main class="section">
        <div class="contato-container">
            
            <!-- Lado Esquerdo: Formulário Expandido -->
            <form class="form-contato" action="https://formspree.io/f/xqpakjdz" method="POST">
                <h2>Entre em Contato</h2>
                
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>


          <!-- Lado Direito: Imagem de Destaque -->
				<div class="contato-info">
					<img src="png/arte2.png" alt="Ilustração de Contato NatArt" class="img-contato">
				</div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="instagram-container">
            <a href="https://www.instagram.com/naty.artee" target="_blank" rel="noopener noreferrer" class="instagram-link">
                <!-- Ícone do Instagram em SVG Padrão Otimizado -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="insta-icon">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Siga no Instagram: <strong>@naty.artee</strong></span>
            </a>
        </div>
        
        <p>&copy; 2026 NatArt. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
